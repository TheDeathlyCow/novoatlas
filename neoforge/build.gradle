plugins {
    id 'multiloader-loader'
    id 'org.relativitymc.neo-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    List.of(
            "imageio-webp",
            "imageio-metadata",
            "imageio-core"
    ).forEach {
        include("com.twelvemonkeys.imageio:$it:${project.twelvemonkeys_imageio_version}")
    }

    List.of(
            "common-image",
            "common-io",
            "common-lang"
    ).forEach {
        include("com.twelvemonkeys.common:$it:${project.twelvemonkeys_imageio_version}")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
        convertAw2At(tasks.named("jar"), ["${mod_id}.accesswidener"])
    }

    runs {
        client {
            client()
            setConfigName('Neoforge Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Neoforge Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}

publishMods {
    type = STABLE
    def changelogFile = rootProject.file("./changelogs/${project.version}.md")

    changelog = changelogFile.text

    file = jar.archiveFile
    displayName = "NovoAtlas Neoforge ${project.version}"

    modLoaders.addAll("neoforge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1297254"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = false
        serverRequired = true

        optional("terrablender-neoforge")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "yh3a3Yc8"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        optional("terrablender")
    }
}