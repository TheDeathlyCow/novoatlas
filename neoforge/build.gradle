import java.nio.file.Files

plugins {
    id 'multiloader-loader'
    id 'org.relativitymc.neo-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    neoForge "net.neoforged:neoforge:${neoforge_version}"

    List.of(
            "imageio-webp",
            "imageio-metadata",
            "imageio-core"
    ).forEach {
        include("com.twelvemonkeys.imageio:$it:${project.twelvemonkeys_imageio_version}")
    }

    List.of(
            "common-image",
            "common-io",
            "common-lang"
    ).forEach {
        include("com.twelvemonkeys.common:$it:${project.twelvemonkeys_imageio_version}")
    }
}

loom {
    convertAw2At(tasks.named("jar"), ["${mod_id}.accesswidener"])

    runs {
        client {
            client()
            setConfigName('Neoforge Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Neoforge Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
