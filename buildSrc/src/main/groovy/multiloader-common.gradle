plugins {
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

def exampleSourceDir = file("$rootDir/common/src/main/resources/resourcepacks")

def buildDatapacks = tasks.register("buildDatapacks") {
    group = "build"
}
def datapackBuildTarget = file("$rootDir/build/datapacks")

def datapackArchives = []

exampleSourceDir.eachDir { dir ->
    if (dir.isDirectory()) {
        def taskName = "buildDatapack${dir.name.capitalize().replace("-", "")}"

        def task = tasks.register(taskName, Zip) {
            group = "build"
            from(dir)
            archiveFileName.set("${dir.name}-${rootProject.version}.zip")
            destinationDirectory.set(datapackBuildTarget)
        }

        tasks.named("buildDatapacks") {
            dependsOn(task)
        }

        datapackArchives << task.flatMap { it.archiveFile }
    }
}

tasks.named("build") {
    dependsOn(buildDatapacks)
}

publishMods {
    changelog = rootProject.file("./changelogs/${project.version}.md").text

    def fabricChangelog = rootProject.file("./changelogs/fabric/${project.version}.md")
    def neoforgeChangelog = rootProject.file("./changelogs/neoforge/${project.version}.md")

    if (fabricChangelog.exists()) {
        changelog += "\n" + fabricChangelog.text
    }

    if (neoforgeChangelog.exists()) {
        changelog += "\n" + neoforgeChangelog.text
    }

    type = STABLE

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1297254"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")
        javaVersions.add(JavaVersion.VERSION_25)
        clientRequired = false
        serverRequired = true
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "yh3a3Yc8"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")
        optional {
            slug = "terrablender"
        }
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        optional {
            slug = "terrablender-fabric"
        }
    }

    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
    }

    curseforge("curseforgeNeoforge") {
        from cfOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
        optional {
            slug = "terrablender-neoforge"
        }
    }

    modrinth("modrinthNeoforge") {
        from mrOptions
        file project(":neoforge")
        modLoaders.add("neoforge")
    }

    github {
        repository = "TheDeathlyCow/novoatlas"
        accessToken = providers.environmentVariable("RELEASE_GITHUB_TOKEN")
        commitish = "26.1.x"
        tagName = "${project.version}"

        displayName = "[26.1.x] NovoAtlas Example Datapacks ${project.version}"

        additionalFiles.from(datapackArchives)
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
