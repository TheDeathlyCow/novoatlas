plugins {
    id 'com.github.johnrengelman.shadow'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
    forge {
        mixinConfigs = [
                "novoatlas.mixins.json"
        ]
    }
}

repositories {
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net'
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.minecraft_version-$rootProject.forge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    from(rootProject.file("common/src/main/resources")) {
        include("resourcepacks/**")
        include("pack.mcmeta")
    }

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile

    atAccessWideners.add "novoatlas.accesswidener"
}

publishMods {
    type = BETA
    def changelogFile = file("../changelogs/${mod_version}.md")
    def changelogForgeFile = file("./changelogs/${mod_version}.md")

    changelog = changelogFile.text

    if (changelogForgeFile.exists()) {
        changelog += "\n" + changelogForgeFile.text
    }

    file = remapJar.archiveFile
    displayName = "NovoAtlas Forge ${mod_version}"

    modLoaders.addAll("forge")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1297254"
        minecraftVersions.addAll("1.20", "1.20.1")

        javaVersions.add(JavaVersion.VERSION_17)

        clientRequired = false
        serverRequired = true

        optional("terrablender")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "yh3a3Yc8"
        minecraftVersions.addAll("1.20", "1.20.1")

        optional("terrablender")
    }
}