plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    List.of(
            "imageio-webp",
            "imageio-metadata",
            "imageio-core"
    ).forEach {
        include("com.twelvemonkeys.imageio:$it:${project.twelvemonkeys_imageio_version}")
    }

    List.of(
            "common-image",
            "common-io",
            "common-lang"
    ).forEach {
        include("com.twelvemonkeys.common:$it:${project.twelvemonkeys_imageio_version}")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

publishMods {
    type = STABLE
    def changelogFile = rootProject.file("./changelogs/${project.version}.md")

    changelog = changelogFile.text

    file = jar.archiveFile
    displayName = "NovoAtlas Fabric ${project.version}"

    modLoaders.addAll("fabric", "quilt")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1297254"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        javaVersions.add(JavaVersion.VERSION_25)

        clientRequired = false
        serverRequired = true

        requires("fabric-api")

        optional("terrablender-fabric")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "yh3a3Yc8"
        minecraftVersions.addAll("26.1", "26.1.1", "26.1.2")

        requires("fabric-api")

        optional("terrablender")
    }
}